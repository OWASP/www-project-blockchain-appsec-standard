name: Markdown Formatting Validation

on:
  push:
    branches: [ "main" ]
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - '**.md'
      - '**.markdown'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdown-lint:
    name: Validate Markdown
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Markdown lint
        run: |
          npx --yes markdownlint-cli2 "**/*.md" "**/*.markdown"
